<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IKUN 桌宠 · 一张立绘，七种动作</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
    background: #f4f5f7; color: #1f2328;
  }
  @media (prefers-color-scheme: dark) { body { background: #16181c; color: #e8eaed; } }
  h1 { font-size: 20px; margin: 0 0 6px; }
  p.lede { margin: 0 0 24px; opacity: .68; font-size: 13.5px; line-height: 1.65; max-width: 900px; }
  p.lede code { padding: 1px 5px; border-radius: 5px; background: rgba(128,128,128,.16); font-size: 12.5px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); gap: 14px; }
  .card { border-radius: 16px; padding: 12px 12px 10px; background: #fff; border: 1px solid rgba(0,0,0,.07); box-shadow: 0 2px 10px rgba(0,0,0,.05); }
  @media (prefers-color-scheme: dark) { .card { background: #1e2126; border-color: rgba(255,255,255,.09); } }

  .stage { position: relative; height: 210px; }
  .shadow {
    position: absolute; left: 50%; bottom: 2px; width: 54%; height: 12px;
    transform: translateX(-50%); border-radius: 50%;
    background: radial-gradient(closest-side, rgba(0,0,0,.30), rgba(0,0,0,0) 78%);
  }
  .motion { position: absolute; inset: 0; transform-origin: 50% 94%; }
  .art {
    width: 100%; height: 100%; object-fit: contain; object-position: center bottom; display: block;
    filter: drop-shadow(0 5px 10px rgba(0,0,0,.16));
  }
  .fx { position: absolute; inset: 0; pointer-events: none; }
  .fx > * { position: absolute; }
  .fx i[data-fx="sweat"] { width: 9px; height: 9px; border-radius: 50% 50% 50% 0; background: linear-gradient(140deg,#8fd3ff,#3fa9f5); box-shadow: 0 1px 2px rgba(0,0,0,.18); animation: fx-sweat 1.6s ease-out infinite; }
  .fx i[data-fx="dot"] { width: 6px; height: 6px; border-radius: 50%; background: #8a919c; animation: fx-dot 1.5s ease-in-out infinite; }
  .fx i[data-fx="mark"] { font: 700 20px/1 system-ui, sans-serif; color: #4d6bfe; animation: fx-mark 1.4s ease-in-out infinite; }
  .fx i[data-fx="zzz"] { font: 700 17px/1 system-ui, sans-serif; color: #7b8290; animation: fx-zzz 2.8s ease-out infinite; }
  .fx i[data-fx="confetti"] { width: 8px; height: 8px; border-radius: 2px; animation: fx-confetti 1.5s ease-out infinite; }

  .bubble {
    position: absolute; left: 50%; bottom: calc(100% - 26px); transform: translateX(-50%);
    max-width: 210px; padding: 5px 10px; border-radius: 12px;
    border: 1px solid rgba(0,0,0,.08); background: rgba(255,255,255,.97); color: #1f2328;
    font-size: 12px; white-space: nowrap; box-shadow: 0 6px 20px rgba(0,0,0,.16);
  }
  @media (prefers-color-scheme: dark) { .bubble { background: #2a2e35; color: #e8eaed; border-color: rgba(255,255,255,.12); } }
  .bubble::after { content: ''; position: absolute; top: 100%; left: 50%; transform: translateX(-50%); border: 6px solid transparent; border-top-color: rgba(255,255,255,.97); }
  @media (prefers-color-scheme: dark) { .bubble::after { border-top-color: #2a2e35; } }

  .meta { display: flex; align-items: baseline; gap: 8px; padding-top: 8px; border-top: 1px solid rgba(128,128,128,.18); }
  .meta b { font-size: 14px; }
  .meta code { font-size: 11.5px; opacity: .62; }
  .meta span { margin-left: auto; font-size: 11.5px; opacity: .62; }

  @keyframes pet-breathe { 0%,100% { transform: translateY(0) scale(1,1); } 50% { transform: translateY(-5px) scale(1.008,1.022); } }
  @keyframes pet-think { 0%,100% { transform: rotate(-5deg) translateY(0); } 32% { transform: rotate(-6.5deg) translateY(-3px); } 68% { transform: rotate(5deg) translateY(-1px); } }
  @keyframes pet-dribble { 0%,100% { transform: translateY(0) scale(1.05,.93); } 28% { transform: translateY(-19px) scale(.97,1.06); } 56% { transform: translateY(-5px) scale(1.01,.99); } 76% { transform: translateY(0) scale(1.07,.91); } }
  @keyframes pet-peek { 0%,100% { transform: translateY(-2px) rotate(-3deg); } 36% { transform: translateY(-10px) rotate(1deg) scale(1.022,1); } 70% { transform: translateY(-2px) rotate(3.5deg); } }
  @keyframes pet-droop { 0%,52%,100% { transform: translateY(8px) rotate(-5deg) scale(.975,.955); } 10% { transform: translateY(9px) rotate(-8.5deg) scale(.975,.955); } 20% { transform: translateY(7px) rotate(-1.5deg) scale(.98,.96); } 32% { transform: translateY(9px) rotate(-7deg) scale(.975,.955); } }
  @keyframes pet-cheer { 0% { transform: translateY(0) scale(1.06,.92); } 14% { transform: translateY(5px) scale(1.13,.85); } 40% { transform: translateY(-42px) scale(.94,1.1) rotate(-7deg); } 64% { transform: translateY(-14px) scale(.99,1.02) rotate(5deg); } 84% { transform: translateY(0) scale(1.09,.89); } 100% { transform: translateY(0) scale(1.06,.92); } }
  @keyframes pet-sleep { 0%,100% { transform: translateY(2px) rotate(-2deg) scale(1,1); } 50% { transform: translateY(9px) rotate(-2deg) scale(1.035,.962); } }
  @keyframes pet-shadow-hop { 0%,100% { transform: translateX(-50%) scale(1); opacity:.85; } 28% { transform: translateX(-50%) scale(.76); opacity:.42; } 56% { transform: translateX(-50%) scale(.93); opacity:.7; } }
  @keyframes pet-shadow-cheer { 0% { transform: translateX(-50%) scale(1); opacity:.9; } 14% { transform: translateX(-50%) scale(1.08); opacity:.95; } 40% { transform: translateX(-50%) scale(.62); opacity:.28; } 64% { transform: translateX(-50%) scale(.9); opacity:.66; } 100% { transform: translateX(-50%) scale(1); opacity:.9; } }
  @keyframes fx-sweat { 0% { opacity:0; transform: translate(0,0) rotate(-45deg) scale(.4); } 18% { opacity:.95; } 100% { opacity:0; transform: translate(16px,-44px) rotate(-45deg) scale(1.05); } }
  @keyframes fx-dot { 0%,70%,100% { opacity:.22; transform: translateY(0); } 35% { opacity:1; transform: translateY(-5px); } }
  @keyframes fx-mark { 0%,100% { opacity:.55; transform: translateY(0) rotate(-6deg); } 45% { opacity:1; transform: translateY(-7px) rotate(8deg); } }
  @keyframes fx-zzz { 0% { opacity:0; transform: translate(0,0) scale(.6); } 22% { opacity:.92; } 100% { opacity:0; transform: translate(13px,-54px) scale(1.15); } }
  @keyframes fx-confetti { 0% { opacity:0; transform: translate(0,0) rotate(0deg) scale(.5); } 16% { opacity:1; } 100% { opacity:0; transform: translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(1); } }
</style>
</head>
<body>
  <h1>IKUN 桌宠 · 一张立绘，七种动作</h1>
  <p class="lede">
    下面七个格子里的 <code>&lt;img&gt;</code> 是<strong>同一个文件</strong> <code>assets/pet.webp</code>。
    状态差异只来自三样东西：<strong>动作</strong>（每状态一套 transform keyframes，支点在身体底部，所以起跳像站在地上）、
    <strong>特效</strong>（汗滴 / Z / 彩纸 / 思考点，纯 CSS 画的）、以及<strong>气泡文案</strong>。
    装进 DSH 后跑的就是这套 CSS。
  </p>
  <div class="grid" id="grid"></div>

<script>
const PET = '../assets/pet.webp';
const STATES = [
  { key: 'idle', title: '待机', bubble: '休息中~ 有事叫我', hint: '呼吸起伏', when: '没有 Agent 在跑',
    motion: 'pet-breathe 3.6s ease-in-out infinite', shadow: 'none', filter: '', fx: [] },
  { key: 'review', title: '思考', bubble: '让我想想…', hint: '缓缓歪头', when: 'Agent 运行中，暂无工具活动',
    motion: 'pet-think 4.4s ease-in-out infinite', shadow: 'none', filter: '', fx: [
      { kind: 'dot', x: 74, y: 22, delay: 0 }, { kind: 'dot', x: 81, y: 22, delay: 0.2 }, { kind: 'dot', x: 88, y: 22, delay: 0.4 } ] },
  { key: 'working', title: '干活', bubble: '正在努力搬砖 🏀', hint: '快速弹跳', when: '有工具正在执行',
    motion: 'pet-dribble .56s cubic-bezier(.34,.72,.42,1) infinite', shadow: 'pet-shadow-hop .56s cubic-bezier(.34,.72,.42,1) infinite',
    filter: 'saturate(1.06) contrast(1.02)', fx: [
      { kind: 'sweat', x: 12, y: 34, delay: 0 }, { kind: 'sweat', x: 6, y: 50, delay: 0.28 } ] },
  { key: 'waiting', title: '等你', bubble: '在等你回复哦~', hint: '前倾探头', when: '审批 / 提问挂起',
    motion: 'pet-peek 1.9s ease-in-out infinite', shadow: 'none', filter: '', fx: [
      { kind: 'mark', text: '?', x: 84, y: 12, delay: 0 } ] },
  { key: 'failed', title: '出错', bubble: '呜…出错了 (._.)', hint: '抖两下再垂头', when: 'agent/error 或请求失败',
    motion: 'pet-droop 1.8s ease-in-out infinite', shadow: 'none', filter: 'saturate(.45) brightness(.93)', fx: [
      { kind: 'sweat', x: 14, y: 28, delay: 0 }, { kind: 'sweat', x: 84, y: 34, delay: 0.6 } ] },
  { key: 'celebrating', title: '完成', bubble: '完成啦！你干嘛~哎哟', hint: '蓄力起跳', when: '全部 Agent 从忙到全停（并播放语音）',
    motion: 'pet-cheer .78s cubic-bezier(.3,.86,.36,1) infinite', shadow: 'pet-shadow-cheer .78s cubic-bezier(.3,.86,.36,1) infinite',
    filter: 'saturate(1.18) brightness(1.05)', fx: [
      { kind: 'confetti', x: 30, y: 30, dx: -34, dy: -34, rot: -140, delay: 0, hue: '#ff5d8f' },
      { kind: 'confetti', x: 50, y: 24, dx: -8, dy: -46, rot: 120, delay: .12, hue: '#ffd23f' },
      { kind: 'confetti', x: 70, y: 30, dx: 32, dy: -36, rot: 160, delay: .24, hue: '#4cc9f0' },
      { kind: 'confetti', x: 22, y: 52, dx: -40, dy: -12, rot: -90, delay: .34, hue: '#8ac926' },
      { kind: 'confetti', x: 78, y: 52, dx: 40, dy: -14, rot: 90, delay: .44, hue: '#b388ff' },
      { kind: 'confetti', x: 50, y: 62, dx: 4, dy: -30, rot: 200, delay: .56, hue: '#ff8fab' } ] },
  { key: 'sleeping', title: '打盹', bubble: 'Zzz… 还在这儿哦', hint: '更慢更沉', when: '空闲超过 75 秒',
    motion: 'pet-sleep 5s ease-in-out infinite', shadow: 'none', filter: 'saturate(.8) brightness(.9)', fx: [
      { kind: 'zzz', text: 'Z', x: 80, y: 30, delay: 0 }, { kind: 'zzz', text: 'Z', x: 86, y: 22, delay: .9 }, { kind: 'zzz', text: 'z', x: 91, y: 15, delay: 1.8 } ] },
];

document.getElementById('grid').innerHTML = STATES.map((s) => {
  const fx = s.fx.map((f) => {
    const style = [`left:${f.x}%`, `top:${f.y}%`, `animation-delay:${f.delay}s`];
    if (f.kind === 'confetti') style.push(`background:${f.hue}`, `--dx:${f.dx}px`, `--dy:${f.dy}px`, `--rot:${f.rot}deg`);
    return `<i data-fx="${f.kind}" style="${style.join(';')}">${f.text ?? ''}</i>`;
  }).join('');
  const filter = s.filter ? `${s.filter} drop-shadow(0 5px 10px rgba(0,0,0,.16))` : 'drop-shadow(0 5px 10px rgba(0,0,0,.16))';
  return `
  <div class="card" data-state="${s.key}">
    <div class="stage">
      <div class="shadow" style="animation:${s.shadow}"></div>
      <div class="motion" style="animation:${s.motion}">
        <img class="art" src="${PET}" alt="${s.title}" style="filter:${filter}">
        <div class="fx">${fx}</div>
      </div>
      <div class="bubble">${s.bubble}</div>
    </div>
    <div class="meta"><b>${s.title}</b><code>${s.key}</code><span>${s.hint}</span></div>
  </div>`;
}).join('');

// 完成音：点一下页面解锁后，点「完成」那张卡即可试听。
const audio = new Audio('../assets/voice.mp3');
document.addEventListener('pointerdown', () => {
  audio.muted = true;
  audio.play().then(() => { audio.pause(); audio.muted = false; }, () => {});
}, { once: true });
const cheer = document.querySelector('.card[data-state="celebrating"]');
if (cheer) {
  cheer.style.cursor = 'pointer';
  cheer.title = '点一下试听「你干嘛~」';
  cheer.addEventListener('click', () => { audio.currentTime = 0; audio.play().catch(() => {}); });
}
</script>
</body>
</html>
